name: Gerar APK Android
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Montar catálogo offline
        run: |
          python tools/build_catalog.py
          python tools/validate_catalog.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Instalar SDK
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Salvar catálogo gerado no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "Adicionar base de sintomas offline"
            git push
          fi
      - name: Compilar APK debug
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AutoCheck-v1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
